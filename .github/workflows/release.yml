name: Release

on:
    push:
        tags:
            - "*"

env:
    PLUGIN_NAME: obsidian-spaced-repetition

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write
            attestations: write
            artifact-metadata: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
              with:
                  node-version: "24"

            - name: Build files
              id: build
              run: |
                  npm install -g pnpm
                  pnpm build

            - name: Verify Files Exist
              id: verify-files
              run: |
                  ls -la build/main.js styles.css manifest.json

            - name: Generate artifact attestation
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: |
                      build/main.js
                      styles.css

            - name: Package files
              id: package
              run: |
                  mkdir ${{ env.PLUGIN_NAME }}
                  cp build/main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
                  zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}
                  ls
                  echo "::set-output name=tag_name::$(git tag --sort version:refname | tail -n 1)"

            - name: Extract release notes
              id: extract-release-notes
              uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0
              with:
                  changelog_file: docs/docs/changelog.md

            - name: Rename zip asset
              run: mv ./${{ env.PLUGIN_NAME }}.zip ./${{ env.PLUGIN_NAME }}-${{ steps.build.outputs.tag_name }}.zip

            - name: Create Release and Upload Assets
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
              with:
                  tag: ${{ github.ref }}
                  name: ${{ github.ref }}
                  artifacts: "${{ env.PLUGIN_NAME }}-${{ steps.build.outputs.tag_name }}.zip,build/main.js,manifest.json,styles.css"
                  body: ${{ steps.extract-release-notes.outputs.release_notes }}
                  draft: false
                  prerelease: false
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Use Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.14"

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Deploy the documentation
              run: mkdocs gh-deploy --force --clean --verbose
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
